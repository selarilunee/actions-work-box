name: Free Tmate VPS

on:
  workflow_dispatch:

jobs:
  vps:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Start Tmate VPS Service
        uses: mxschmitt/action-tmate@v3
        with:
          detached: true
          limit-access-to-actor: false
