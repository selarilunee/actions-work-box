name: 手动临时 SSH

# 仅手动触发。不读取仓库 secrets，也不上传 ix.io。自己开 sshd + tmux + cloudflared 临时隧道。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ssh:
    name: 打开临时 SSH
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: SSH 登录
        env:
          AUTHORIZED_KEYS: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJAguxLs9gGxxbPJPc4R0K5MHtq0xl2hNfBNXv4j20s8 action-sshd-cloudflared"
        run: |
          set -euo pipefail
          cleanup() { tmux kill-server 2>/dev/null || true; kill "$cf_pid" "$sshd_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$AUTHORIZED_KEYS" > ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys
          ssh-keygen -q -f ~/.ssh/ssh_host_rsa_key -N ''
          /usr/sbin/sshd -p 2222 -h "$HOME/.ssh/ssh_host_rsa_key" -o PasswordAuthentication=no -o PubkeyAuthentication=yes -o AuthorizedKeysFile="$HOME/.ssh/authorized_keys" -D &
          sshd_pid=$!
          grep -q 'exec tmux attach' ~/.bashrc 2>/dev/null || printf 'if [ -n "$SSH_TTY" ] && [ -z "$TMUX" ]; then exec tmux attach -t debug || exec tmux new -s debug; fi\n' >> ~/.bashrc
          tmux new-session -d -s debug
          curl -fsSL -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          ./cloudflared tunnel --no-autoupdate --url tcp://localhost:2222 > cloudflared.log 2>&1 &
          cf_pid=$!
          host=""
          for i in $(seq 1 60); do
            if ! kill -0 "$cf_pid" 2>/dev/null; then echo "错误：cloudflared 进程已退出" >&2; cat cloudflared.log >&2; exit 1; fi
            host=$(grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' cloudflared.log | head -1 || true)
            [ -n "$host" ] && break
            sleep 1
          done
          if [ -z "$host" ]; then echo "错误：Cloudflare 隧道 60 秒未就绪" >&2; cat cloudflared.log >&2; exit 1; fi
          pubkey=$(cut -d' ' -f1,2 ~/.ssh/ssh_host_rsa_key.pub)
          echo "临时断开（job 继续）：Ctrl-b 然后 d"
          echo "结束会话（job 收尾）：tmux kill-session -t debug"
          echo "ssh-keygen -R action-sshd-cloudflared && echo 'action-sshd-cloudflared $pubkey' >> ~/.ssh/known_hosts && ssh -i /path/to/action-sshd-cloudflared -o ProxyCommand='cloudflared access tcp --hostname $host' runner@action-sshd-cloudflared"
          tmux wait-for channel
