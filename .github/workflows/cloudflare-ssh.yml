name: cloudflare-ssh

on:
  workflow_dispatch:

jobs:
  ssh:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: 启动 sshd + Cloudflare Quick Tunnel
        run: |
          set -e
          printf '%s\n' 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJAguxLs9gGxxbPJPc4R0K5MHtq0xl2hNfBNXv4j20s8 action-sshd-cloudflared' > authorized_keys
          chmod 600 authorized_keys
          sudo ssh-keygen -A
          sudo mkdir -p /run/sshd
          sudo /usr/sbin/sshd -p 2222 \
            -o "AuthorizedKeysFile=$PWD/authorized_keys" \
            -o PasswordAuthentication=no -D &

          # Quick Tunnel：无需账号/域名，日志里给出 *.trycloudflare.com
          {
            echo 'deb [trusted=yes] https://pkg.cloudflare.com/cloudflared any main' | sudo tee /etc/apt/sources.list.d/cloudflared.list
            sudo apt-get update -qq 2>/dev/null
            sudo apt-get install -y cloudflared 2>/dev/null || { echo "cloudflared 安装失败" >&2; exit 1; }
          } >/dev/null
          cloudflared tunnel --no-autoupdate --url tcp://localhost:2222 > cloudflared.log 2>&1 &
          cf_pid=$!

          url=""
          for i in $(seq 1 60); do
            url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' cloudflared.log | head -1 || true)
            [ -n "$url" ] && break
            sleep 1
          done
          [ -n "$url" ] || { cat cloudflared.log >&2; exit 1; }

          echo "隧道地址：$url"
          echo "本机需已安装 cloudflared，把私钥路径换成自己的后连接："
          echo "ssh -i /path/to/action-sshd-cloudflared -o ProxyCommand='cloudflared access tcp --hostname $url' -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null runner@github-actions"
          echo "结束方式一（正常完成，绿色）：在 SSH 会话里执行 pkill -x cloudflared，连接会立即断开"
          echo "结束方式二（取消，灰色）：在 Actions 页面 Cancel workflow"
          wait "$cf_pid" || true
